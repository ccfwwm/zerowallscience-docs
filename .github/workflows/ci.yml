name: CI
on: { pull_request: {}, push: { branches: [main] }, workflow_call: {} }
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: "frontend/package-lock.json" }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx vitest run src/lib/__tests__/serverUrl.test.ts
        working-directory: frontend
      - run: python3 scripts/tests/zerowall-deploy.test.py
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: node --import tsx --test tests/official-site-bootstrap.test.ts tests/notebook-publication-standard-entry.test.ts
        working-directory: backend
      - run: npm ci
        working-directory: website
      - run: npm test && npm run build
        working-directory: website
