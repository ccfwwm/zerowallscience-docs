services:
  mcp:
    image: zerowallscience-docs-mcp:${MCP_DEPLOY_SHA:?set MCP_DEPLOY_SHA}
    container_name: zerowallscience-docs-mcp
    # 网关强制回环监听；host 网络用于访问宿主 127.0.0.1:13001。
    network_mode: host
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3133/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
