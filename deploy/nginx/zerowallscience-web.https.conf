server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zerowallscience.org zerowallscience.com www.zerowallscience.com;
    ssl_certificate /etc/letsencrypt/live/zerowallscience-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerowallscience-web/privkey.pem;
    return 301 https://zerowallscience.org$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zerowallscience.org;
    ssl_certificate /etc/letsencrypt/live/zerowallscience-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerowallscience-web/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/zerowallscience-web/current;
    index index.html;
    client_max_body_size 100m;
    if (-f /opt/zerowallscience-docs/maintenance) { return 503; }
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /zh { return 301 /; }
    location ^~ /zh/ { return 301 /; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:13001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location = /ws { proxy_pass http://127.0.0.1:13001; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
    location = /admin/ws { proxy_pass http://127.0.0.1:13001/ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
    location = /admin { return 301 /admin/; }
    location ^~ /admin/ { proxy_pass http://127.0.0.1:13001/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_http_version 1.1; }
    location = /docs { return 301 /docs/; }
    location ^~ /docs/ { proxy_pass http://127.0.0.1:13001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_http_version 1.1; }
    location ~* \.(js|css|woff2?|ttf|ico|svg|webp|png|jpg|jpeg|gif|avif)$ { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
    location ~ /\. { return 404; }
}
